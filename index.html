<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki de Projet</title>
    <!-- Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkpanel: '#1e293b',
                        darkcard: '#334155',
                        brand: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- Marked.js pour le rendu Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js pour la coloration syntaxique du code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Mermaid.js pour les diagrammes d'architecture -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- Vis-network pour le graphe interactif -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        .prose pre { background: #1e293b !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { color: #38bdf8; font-family: monospace; }
        .prose a { color: #60a5fa; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
        .prose h1, .prose h2, .prose h3 { color: #f8fafc; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose h1 { font-size: 1.875rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .prose h2 { font-size: 1.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.25rem; }
        .prose h3 { font-size: 1.25rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.7; color: #cbd5e1; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #94a3b8; font-style: italic; margin: 1rem 0; }
        .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .prose th, .prose td { border: 1px solid #475569; padding: 0.5rem 0.75rem; text-align: left; }
        .prose th { background-color: #1e293b; color: #f1f5f9; }
        .wiki-link { background: rgba(59, 130, 246, 0.15); color: #93c5fd; padding: 0.15rem 0.35rem; border-radius: 0.25rem; border-bottom: 1px solid #3b82f6; cursor: pointer; text-decoration: none !important; }
        .wiki-link:hover { background: rgba(59, 130, 246, 0.3); }
        #network-graph { height: 100%; width: 100%; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 flex h-screen overflow-hidden font-sans antialiased">

    <!-- Barre latérale / Explorateur -->
    <aside class="w-80 bg-darkpanel border-r border-slate-700/60 flex flex-col flex-shrink-0 select-none">
        <div class="p-4 border-b border-slate-700/60 flex items-center justify-between">
            <div class="flex items-center space-x-2 overflow-hidden">
                <span class="text-2xl">🧠</span>
                <div class="truncate">
                    <h1 id="nom-projet-titre" class="font-bold text-base tracking-tight text-white leading-tight truncate">Wiki Projet</h1>
                    <p id="chemin-projet-sub" class="text-[11px] text-slate-400 truncate">Chargement...</p>
                </div>
            </div>
            <button onclick="ouvrirModalCreation()" title="Créer une nouvelle page" class="p-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-medium text-xs flex items-center space-x-1 shadow transition flex-shrink-0">
                <span>+ Page</span>
            </button>
        </div>

        <!-- Barre de recherche -->
        <div class="p-3 border-b border-slate-700/60">
            <div class="relative">
                <input id="champ-recherche" oninput="filtrerFichiers(this.value)" type="text" placeholder="Rechercher une note..." class="w-full bg-slate-900/90 text-sm rounded-lg px-3 py-2 pl-9 text-slate-200 placeholder-slate-500 border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Navigation principale -->
        <div class="px-3 py-2 flex space-x-1 border-b border-slate-700/60 text-xs">
            <button onclick="changerVue('notes')" id="tab-notes" class="flex-1 py-1.5 px-2 rounded font-medium bg-slate-800 text-blue-400 text-center">📁 Notes</button>
            <button onclick="changerVue('graphe')" id="tab-graphe" class="flex-1 py-1.5 px-2 rounded font-medium hover:bg-slate-800 text-slate-400 text-center">🕸️ Graphe</button>
        </div>

        <!-- Arborescence des fichiers -->
        <div id="liste-fichiers" class="flex-1 overflow-y-auto p-3 space-y-4">
            <!-- Rempli dynamiquement en JS -->
        </div>

        <!-- Pied de barre latérale -->
        <div class="p-3 border-t border-slate-700/60 text-xs text-slate-400 flex items-center justify-between">
            <span id="compteur-fichiers">Chargement...</span>
            <button onclick="chargerFichiers()" class="hover:text-white" title="Recharger la liste">🔄 Actualiser</button>
        </div>
    </aside>

    <!-- Zone Principale -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-900/50">
        <!-- Barre supérieure du document -->
        <header id="entete-document" class="h-14 bg-darkpanel/80 backdrop-blur border-b border-slate-700/60 px-6 flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-hidden">
                <span id="dossier-badge" class="px-2 py-0.5 text-xs font-semibold rounded bg-slate-800 text-slate-400 border border-slate-700">wiki</span>
                <span id="titre-actuel" class="font-semibold text-slate-200 truncate">Sélectionnez une page</span>
                <span id="indicateur-sauvegarde" class="text-xs text-emerald-400 hidden">✓ Sauvegardé</span>
            </div>
            
            <div id="actions-document" class="flex items-center space-x-2 hidden">
                <div class="bg-slate-800 p-0.5 rounded-lg border border-slate-700 flex text-xs">
                    <button id="btn-mode-lecture" onclick="basculerMode('lecture')" class="px-3 py-1.5 rounded font-medium bg-blue-600 text-white">Lecture</button>
                    <button id="btn-mode-edition" onclick="basculerMode('edition')" class="px-3 py-1.5 rounded font-medium text-slate-400 hover:text-white">Édition</button>
                </div>
                <button id="btn-enregistrer" onclick="sauvegarderFichierActuel()" class="hidden px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium transition shadow flex items-center space-x-1">
                    <span>💾 Enregistrer (Ctrl+S)</span>
                </button>
                <button onclick="supprimerFichierActuel()" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition" title="Supprimer la page">
                    🗑️
                </button>
            </div>
        </header>

        <!-- Conteneur des Vues -->
        <div class="flex-1 overflow-hidden relative">
            <!-- Vue 1: Lecture Markdown -->
            <div id="vue-lecture" class="h-full overflow-y-auto p-8 max-w-4xl mx-auto prose">
                <div class="text-center py-20 text-slate-500">
                    <p class="text-4xl mb-3">📄</p>
                    <p class="text-lg">Choisissez une note dans la barre latérale pour la consulter.</p>
                </div>
            </div>

            <!-- Vue 2: Éditeur Markdown -->
            <div id="vue-edition" class="h-full hidden flex flex-col p-6">
                <textarea id="editeur-texte" oninput="marquerModifie()" class="flex-1 w-full bg-slate-950 text-slate-100 font-mono text-sm p-4 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500 resize-none shadow-inner leading-relaxed" placeholder="Écrivez votre Markdown ici..."></textarea>
            </div>

            <!-- Vue 3: Graphe interactif -->
            <div id="vue-graphe" class="h-full w-full hidden relative bg-slate-950">
                <div id="network-graph"></div>
                <div class="absolute top-4 left-4 bg-darkpanel/90 border border-slate-700 p-3 rounded-xl text-xs space-y-1 backdrop-blur shadow-lg">
                    <p class="font-semibold text-slate-200 mb-1">💡 Navigation Graphique</p>
                    <p class="text-slate-400">• Cliquez sur un nœud pour ouvrir la note.</p>
                    <p class="text-slate-400">• Les liens <code class="text-blue-400">[[NomPage]]</code> créent les connexions.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal : Nouvelle Page -->
    <div id="modal-creation" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-darkpanel border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white">✨ Créer une nouvelle page</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Dossier</label>
                <select id="nouveau-dossier" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                    <option value="">Racine (wiki/)</option>
                    <option value="decisions">decisions (Choix & ADR)</option>
                    <option value="sessions">sessions (Résumés de travail)</option>
                    <option value="architecture">architecture (Schémas & Spécifications)</option>
                    <option value="taches">taches (Roadmap & Backlog)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nom du fichier (.md)</label>
                <input id="nouveau-nom" type="text" placeholder="ex: 002-gestion-authentification" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="fermerModalCreation()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Annuler</button>
                <button onclick="validerCreation()" class="px-4 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white">Créer la page</button>
            </div>
        </div>
    </div>

    <script>
        // État de l'application
        let tousLesFichiers = [];
        let fichierActuel = null;
        let contenuInitial = "";
        let modeActuel = "lecture"; // 'lecture' ou 'edition'
        let vueActuelle = "notes"; // 'notes' ou 'graphe'
        let networkInstance = null;

        // Configuration du parser Markdown
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang === 'mermaid') {
                    return `<div class="mermaid">${code}</div>`;
                }
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            breaks: true,
            gfm: true
        });

        mermaid.initialize({ startOnLoad: false, theme: 'dark' });

        // Chargement initial
        document.addEventListener('DOMContentLoaded', () => {
            chargerInfoProjet();
            chargerFichiers();
            
            // Raccourci clavier Ctrl+S pour sauvegarder
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (modeActuel === 'edition') {
                        sauvegarderFichierActuel();
                    }
                }
            });
        });

        // Charger les informations du projet
        async function chargerInfoProjet() {
            try {
                const res = await fetch('/api/projet_info');
                const info = await res.json();
                document.getElementById('nom-projet-titre').innerText = info.nom_projet;
                document.getElementById('chemin-projet-sub').innerText = info.repertoire;
                document.title = `Wiki - ${info.nom_projet}`;
            } catch (e) {
                console.error("Erreur projet info:", e);
            }
        }

        // Récupérer la liste des fichiers depuis l'API
        async function chargerFichiers(cheminASelectionner = null) {
            try {
                const res = await fetch('/api/fichiers');
                tousLesFichiers = await res.json();
                afficherArborescence(tousLesFichiers);
                document.getElementById('compteur-fichiers').innerText = `${tousLesFichiers.length} notes`;

                if (cheminASelectionner) {
                    ouvrirFichier(cheminASelectionner);
                } else if (!fichierActuel && tousLesFichiers.length > 0) {
                    // Ouvre index.md par défaut s'il existe
                    const indexFile = tousLesFichiers.find(f => f.chemin === 'index.md');
                    ouvrirFichier(indexFile ? indexFile.chemin : tousLesFichiers[0].chemin);
                }
            } catch (err) {
                console.error("Erreur chargement fichiers:", err);
            }
        }

        // Affichage des fichiers groupés par dossier
        function afficherArborescence(fichiers) {
            const container = document.getElementById('liste-fichiers');
            container.innerHTML = '';

            const groupes = {};
            fichiers.forEach(f => {
                const grp = f.dossier || 'Racine';
                if (!groupes[grp]) groupes[grp] = [];
                groupes[grp].push(f);
            });

            const emojisDossiers = {
                'Racine': '📌',
                'decisions': '⚖️',
                'sessions': '⏱️',
                'architecture': '🏗️',
                'taches': '📋'
            };

            for (const [dossier, items] of Object.entries(groupes)) {
                const grpDiv = document.createElement('div');
                grpDiv.className = 'space-y-1';

                const titreGrp = document.createElement('div');
                titreGrp.className = 'text-[11px] font-bold uppercase tracking-wider text-slate-400 px-2 py-1 flex items-center space-x-1.5';
                titreGrp.innerHTML = `<span>${emojisDossiers[dossier] || '📁'}</span><span>${dossier}</span>`;
                grpDiv.appendChild(titreGrp);

                items.forEach(item => {
                    const itemBtn = document.createElement('button');
                    const estActif = fichierActuel === item.chemin;
                    itemBtn.className = `w-full text-left text-xs px-3 py-1.5 rounded-lg truncate block transition ${
                        estActif ? 'bg-blue-600/20 text-blue-400 font-semibold border border-blue-500/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`;
                    itemBtn.innerText = item.nom.replace('.md', '');
                    itemBtn.onclick = () => ouvrirFichier(item.chemin);
                    grpDiv.appendChild(itemBtn);
                });

                container.appendChild(grpDiv);
            }
        }

        // Filtrage en direct par recherche
        function filtrerFichiers(recherche) {
            const mot = recherche.toLowerCase().trim();
            if (!mot) {
                afficherArborescence(tousLesFichiers);
                return;
            }
            const filtres = tousLesFichiers.filter(f => f.nom.toLowerCase().includes(mot) || f.dossier.toLowerCase().includes(mot));
            afficherArborescence(filtres);
        }

        // Ouvrir et afficher un fichier Markdown
        async function ouvrirFichier(chemin) {
            try {
                const res = await fetch(`/api/fichier?chemin=${encodeURIComponent(chemin)}`);
                if (!res.ok) throw new Error("Erreur lecture");
                const data = await res.json();
                
                fichierActuel = data.chemin;
                contenuInitial = data.contenu;

                document.getElementById('titre-actuel').innerText = data.chemin;
                document.getElementById('dossier-badge').innerText = data.chemin.includes('/') ? data.chemin.split('/')[0] : 'wiki';
                document.getElementById('actions-document').classList.remove('hidden');

                // Mettre à jour l'éditeur
                document.getElementById('editeur-texte').value = data.contenu;

                // Mettre à jour la vue lecture
                rendreMarkdown(data.contenu);
                
                // Réinitialiser en mode lecture
                basculerMode('lecture');
                afficherArborescence(tousLesFichiers);

                // Si on était en vue graphe, basculer sur les notes
                if (vueActuelle === 'graphe') changerVue('notes');
            } catch (err) {
                alert("Impossible d'ouvrir le fichier : " + err.message);
            }
        }

        // Rendu du Markdown avec transformation des liens wiki [[Lien]] ou [[Lien|Texte affiché]]
        function rendreMarkdown(texte) {
            // Remplace [[NomPage|Texte]] ou [[NomPage]] par des liens cliquables
            const texteAvecLiens = texte.replace(/\[\[(.*?)\]\]/g, (match, contenu) => {
                let cible = contenu.trim();
                let texteAffiche = cible;
                if (cible.includes('|')) {
                    const parts = cible.split('|');
                    cible = parts[0].trim();
                    texteAffiche = parts[1].trim();
                }
                return `<a class="wiki-link" onclick="resoudreLienWiki('${cible}')">${texteAffiche}</a>`;
            });

            document.getElementById('vue-lecture').innerHTML = marked.parse(texteAvecLiens);
            
            // Exécute Mermaid pour les blocs de diagrammes
            try {
                mermaid.run({ querySelector: '.mermaid' });
            } catch (e) {
                console.error("Erreur rendu Mermaid:", e);
            }
        }

        // Résolution de clic sur un lien [[Page]]
        function resoudreLienWiki(cible) {
            if (cible.includes('|')) cible = cible.split('|')[0].trim();
            const cibleClean = cible.endsWith('.md') ? cible : cible + '.md';
            const trouve = tousLesFichiers.find(f => f.nom === cibleClean || f.chemin === cibleClean || f.chemin.endsWith('/' + cibleClean));
            if (trouve) {
                ouvrirFichier(trouve.chemin);
            } else {
                if (confirm(`La page "${cible}" n'existe pas encore. Voulez-vous la créer ?`)) {
                    creerPageRapide(cibleClean);
                }
            }
        }

        async function creerPageRapide(nomFichier) {
            await fetch('/api/sauvegarder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chemin: nomFichier, contenu: `# ${nomFichier.replace('.md', '')}\n\nNouvelle page.` })
            });
            chargerFichiers(nomFichier);
        }

        // Basculer entre mode lecture et mode édition
        function basculerMode(mode) {
            modeActuel = mode;
            const btnLecture = document.getElementById('btn-mode-lecture');
            const btnEdition = document.getElementById('btn-mode-edition');
            const btnEnregistrer = document.getElementById('btn-enregistrer');
            const vueLecture = document.getElementById('vue-lecture');
            const vueEdition = document.getElementById('vue-edition');

            if (mode === 'lecture') {
                btnLecture.className = "px-3 py-1.5 rounded font-medium bg-blue-600 text-white";
                btnEdition.className = "px-3 py-1.5 rounded font-medium text-slate-400 hover:text-white";
                btnEnregistrer.classList.add('hidden');
                vueLecture.classList.remove('hidden');
                vueEdition.classList.add('hidden');
                rendreMarkdown(document.getElementById('editeur-texte').value);
            } else {
                btnEdition.className = "px-3 py-1.5 rounded font-medium bg-blue-600 text-white";
                btnLecture.className = "px-3 py-1.5 rounded font-medium text-slate-400 hover:text-white";
                btnEnregistrer.classList.remove('hidden');
                vueLecture.classList.add('hidden');
                vueEdition.classList.remove('hidden');
            }
        }

        // Sauvegarder les modifications
        async function sauvegarderFichierActuel() {
            if (!fichierActuel) return;
            const contenu = document.getElementById('editeur-texte').value;
            try {
                const res = await fetch('/api/sauvegarder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chemin: fichierActuel, contenu: contenu })
                });
                if (res.ok) {
                    const badge = document.getElementById('indicateur-sauvegarde');
                    badge.classList.remove('hidden');
                    setTimeout(() => badge.classList.add('hidden'), 2000);
                    basculerMode('lecture');
                }
            } catch (err) {
                alert("Erreur de sauvegarde: " + err.message);
            }
        }

        // Supprimer le fichier courant
        async function supprimerFichierActuel() {
            if (!fichierActuel) return;
            if (!confirm(`Supprimer définitivement "${fichierActuel}" ?`)) return;
            try {
                const res = await fetch('/api/supprimer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chemin: fichierActuel })
                });
                if (res.ok) {
                    fichierActuel = null;
                    document.getElementById('actions-document').classList.add('hidden');
                    document.getElementById('titre-actuel').innerText = "Sélectionnez une page";
                    document.getElementById('vue-lecture').innerHTML = `<div class="text-center py-20 text-slate-500"><p class="text-4xl mb-3">📄</p><p class="text-lg">Page supprimée.</p></div>`;
                    chargerFichiers();
                }
            } catch (err) {
                alert("Erreur suppression: " + err.message);
            }
        }

        // Basculer entre l'onglet Notes et l'onglet Graphe
        function changerVue(vue) {
            vueActuelle = vue;
            const tabNotes = document.getElementById('tab-notes');
            const tabGraphe = document.getElementById('tab-graphe');
            const vueLecture = document.getElementById('vue-lecture');
            const vueEdition = document.getElementById('vue-edition');
            const vueGraphe = document.getElementById('vue-graphe');

            if (vue === 'notes') {
                tabNotes.className = "flex-1 py-1.5 px-2 rounded font-medium bg-slate-800 text-blue-400 text-center";
                tabGraphe.className = "flex-1 py-1.5 px-2 rounded font-medium hover:bg-slate-800 text-slate-400 text-center";
                vueGraphe.classList.add('hidden');
                basculerMode(modeActuel);
            } else {
                tabGraphe.className = "flex-1 py-1.5 px-2 rounded font-medium bg-slate-800 text-blue-400 text-center";
                tabNotes.className = "flex-1 py-1.5 px-2 rounded font-medium hover:bg-slate-800 text-slate-400 text-center";
                vueLecture.classList.add('hidden');
                vueEdition.classList.add('hidden');
                vueGraphe.classList.remove('hidden');
                initialiserGraphe();
            }
        }

        // Initialisation du graphe interactif Vis-Network
        async function initialiserGraphe() {
            try {
                const res = await fetch('/api/graphe');
                const data = await res.json();
                
                const container = document.getElementById('network-graph');
                const couleursGroupes = {
                    'Racine': '#3b82f6',
                    'decisions': '#8b5cf6',
                    'sessions': '#10b981',
                    'architecture': '#f59e0b',
                    'taches': '#ec4899'
                };

                const nodes = new vis.DataSet(data.nodes.map(n => ({
                    id: n.id,
                    label: n.label,
                    color: {
                        background: couleursGroupes[n.group] || '#64748b',
                        border: '#ffffff'
                    },
                    font: { color: '#ffffff', face: 'system-ui' }
                })));

                const edges = new vis.DataSet(data.edges.map(e => ({
                    from: e.from,
                    to: e.to,
                    arrows: 'to',
                    color: { color: '#475569', highlight: '#3b82f6' }
                })));

                const options = {
                    nodes: { shape: 'dot', size: 16 },
                    physics: {
                        barnesHut: { gravitationalConstant: -3000, springLength: 95 }
                    }
                };

                networkInstance = new vis.Network(container, { nodes, edges }, options);
                networkInstance.on('click', (params) => {
                    if (params.nodes.length > 0) {
                        ouvrirFichier(params.nodes[0]);
                    }
                });
            } catch (err) {
                console.error("Erreur graphe:", err);
            }
        }

        // Modal de création
        function ouvrirModalCreation() {
            document.getElementById('modal-creation').classList.remove('hidden');
            document.getElementById('nouveau-nom').focus();
        }
        function fermerModalCreation() {
            document.getElementById('modal-creation').classList.add('hidden');
            document.getElementById('nouveau-nom').value = '';
        }
        async function validerCreation() {
            const dossier = document.getElementById('nouveau-dossier').value;
            let nom = document.getElementById('nouveau-nom').value.trim();
            if (!nom) return;
            if (!nom.endsWith('.md')) nom += '.md';
            
            const chemin = dossier ? `${dossier}/${nom}` : nom;
            const contenuDefaut = `# ${nom.replace('.md', '')}\n\nCréé le ${new Date().toLocaleDateString('fr-FR')}.\n\n## Description\n\n`;

            await fetch('/api/sauvegarder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chemin: chemin, contenu: contenuDefaut })
            });

            fermerModalCreation();
            chargerFichiers(chemin);
        }
    </script>
</body>
</html>
